# OpenTelemetry Collector — receives OTLP from Claude Code, exposes metrics to
# Prometheus and forwards traces to Tempo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
  # Keep session.id as a label so you can group/drill by session in Grafana.
  # (Cardinality is fine for a single user; drop this if you ever go multi-user.)
  resource:
    attributes:
      - key: service.name
        value: claude-code
        action: upsert

exporters:
  # Metrics -> Prometheus scrape endpoint on :8889
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true          # promote resource attrs (session.id, user.email...) to labels
    enable_open_metrics: true
  # Traces -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Handy while setting up: also print to collector logs
  debug:
    verbosity: normal

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
